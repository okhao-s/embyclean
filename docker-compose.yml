services:
  embycleaner:
    container_name: embyclean
    image: okhao/emby_cleaner:latest
    build:
      context: .
    ports:
      - "19898:19898"
    volumes:
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:19898/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
