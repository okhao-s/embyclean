services:
  embycleaner:
    container_name: embyclean
    build: .
    ports:
      - "19898:19898"
    volumes:
      - /root/docker/embyclean/embyclean/data:/app/data
    environment:
      - TZ=Asia/Shanghai
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:19898/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
