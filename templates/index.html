}
.lib-card.selected img { opacity: 1; }
.lib-card.selected::before {
    content: 'SELECTED'; position: absolute; top: 8px; right: 8px; z-index: 10;
    background: #38bdf8; color: #020617; font-size: 9px; font-weight: 900; padding: 2px 6px; border-radius: 4px;

input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; color: #fff; outline: none; transition: 0.2s; font-size: 13px; }

</style></head><body>

<script>
const $=id=>document.getElementById(id);
let appConfig={},st={m:'av',ls:new Set(),d:[],p:1,s:new Set(),sid:'',ignS:new Set(),loaded:0,loading:false},PAGE_SIZE=50,currentTasks=[];
window.onload=()=>{poll();gl();lc();setInterval(poll,5000);setInterval(()=>{if($('p-logs').classList.contains('active')) ll()},5000)};

/* 🚀 监听滚动事件：无限加载 */
$('content-area').addEventListener('scroll', () => {
    const el = $('content-area');
    if (el.scrollTop + el.clientHeight >= el.scrollHeight - 100) {
        renderMore();
    }
});

function toast(msg){const t=document.createElement('div');t.className='toast';t.innerText=msg;$('toast-box').appendChild(t);setTimeout(()=>{t.remove()},3500)}
function confirmUI(t,d,i,y){$('conf-title').innerText=t;$('conf-desc').innerText=d;$('conf-icon').innerText=i;$('conf-modal').classList.add('open');$('conf-yes').onclick=()=>{y();closeConf()}}
function closeConf(){$('conf-modal').classList.remove('open')}
function nav(p,el){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('p-'+p).classList.add('active');if(el){document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));el.classList.add('active')} if(p=='settings'){lc();loadIgnored();loadTasks()} if(p=='logs'){ll()}}
async function poll(){
 try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),4000);const resp=await fetch('/api/status',{signal:controller.signal});clearTimeout(timer);const r=await resp.json();
 $('sb-loc').innerText=r.local_cache;$('sb-cln').innerText=r.cleaned_count;$('sb-spc').innerText=(r.saved_space/1e9).toFixed(2)+" GB";
 if(r.connected){$('st-name').innerText=r.server_name||"✅ 已连接";$('st-name').className="font-bold text-white text-lg truncate";$('dot').className="dot-main dot-online"}else{$('st-name').innerText="离线";$('dot').className="dot-main"}
 $('st-ver').innerText=`版本: ${r.server_ver||'--'}`;$('st-user').innerText=`用户: ${r.user_name||'--'}`;st.sid=r.server_id;
 if(document.activeElement !== $('sync-cron-dash')) $('sync-cron-dash').value=r.sync_cron;
 const b=$('btn-sync-side');
 if(r.is_syncing){b.disabled=true;b.innerText="运行中...";$('sync-state-display').innerText=r.sync_lib?`⏳ 索引 [${r.sync_lib}]...`:"⏳ 准备中..."}else{b.disabled=false;b.innerText="🔄 立即同步元数据";$('sync-state-display').innerText=r.connected?"✅ 同步器就绪":"⚠️ Emby 离线 / 非本机"}
 }catch(e){$('st-name').innerText='状态暂不可用';$('dot').className='dot-main';$('sync-state-display').innerText='⚠️ 状态获取失败'}}
function sync(){confirmUI("全量同步","耗时取决于媒体库大小。","🔄",()=>{fetch('/api/sync',{method:'POST'});toast("✅ 同步指令已下发")})}
async function gl(){const r=await fetch('/api/libraries');const d=await r.json();const c=await(await fetch('/api/config')).json();
 $('libs').innerHTML=d.map(l=>`<div class="lib-card" onclick="tl(this,'${l.Id}')"><img src="${l.ImageTags?.Primary?c.host+'/emby/Items/'+l.Id+'/Images/Primary?maxHeight=300':''}"><div class="lib-name">${l.Name}</div></div>`).join('')}
function tl(e,i){if(st.ls.has(i)){st.ls.delete(i);e.classList.remove('selected')}else{st.ls.add(i);e.classList.add('selected')}}
function mode(m,e){st.m=m;document.querySelectorAll('.mode-btn').forEach(x=>x.classList.remove('active'));if(e)e.classList.add('active');if(m=='tiny')$('opt-t').classList.remove('hidden');else $('opt-t').classList.add('hidden')}

async function scan(){
    $('loader').style.display='flex';
    let u=`/api/scan?mode=${st.m}&lib=${Array.from(st.ls).join(',')}&param_s=${$('inp-t').value}&param_d=${$('inp-d').value}`;
    const r=await fetch(u);
    st.d=await r.json();
    st.s.clear();
    st.loaded = 0; 
    st.loading = false;
    $('rbox').innerHTML = ''; 
    rt(); 
    nav('results');
    renderMore(); 
    $('loader').style.display='none';
}

function rt(){
 let h=`<button class="btn-group-item" onclick="bat('all',true)">全选已展示</button><button class="btn-group-item" onclick="bat('all',false)">全不选</button>`;
 if(st.m=='av')h+=`<button class="btn-group-item" onclick="bat('tag','tag_c')">选 [C]</button><button class="btn-group-item" onclick="bat('tag','tag_uc')">选 [UC]</button><button class="btn-group-item" onclick="bat('tag','tag_raw')">选原版</button>`;
 if(st.m=='smart'){const resos=[...new Set(st.d.flatMap(g=>g.items.map(i=>i.resolution)))].filter(x=>x>0).sort((a,b)=>b-a);resos.forEach(r=>h+=`<button class="btn-group-item" onclick="bat('reso',${r})">⚡ ${r}P</button>`);}
 if(st.m=='size')h+=`<button class="btn-group-item" onclick="bat('len','path_long')">最长径</button><button class="btn-group-item" onclick="bat('len','path_short')">最短径</button><button class="btn-group-item" onclick="bat('len','name_long')">最长名</button><button class="btn-group-item" onclick="bat('len','name_short')">最短名</button>`;
 if(st.m=='duration')h+=`<button class="btn-group-item" onclick="bat('filesize','min')">⚡ 选最小文件</button><button class="btn-group-item" onclick="bat('filesize','max')">⚡ 选最大文件</button>`;
 $('tb').innerHTML=h}

function bat(t,a){
    const f=getFlatSlice();
    const s=f.slice(0, st.loaded); 
    s.forEach(i=>{let m=false;if(t=='all')m=a;if(t=='tag'){if(a=='tag_raw')m=!i.tag_c&&!i.tag_uc&&!i.tag_u;else m=i[a]}if(t=='reso')m=i.resolution==a;
    if(t=='len'){const g=st.d.find(gx=>gx.items.some(ix=>ix.emby_id===i.emby_id));if(a=='path_long'){const sr=[...g.items].sort((x,y)=>(x.path||'').length-(y.path||'').length);if(i.emby_id===sr[sr.length-1].emby_id)m=true}if(a=='path_short'){const sr=[...g.items].sort((x,y)=>(x.path||'').length-(y.path||'').length);if(i.emby_id===sr[0].emby_id)m=true}if(a=='name_long'){const sr=[...g.items].sort((x,y)=>(x.name||'').length-(y.name||'').length);if(i.emby_id===sr[sr.length-1].emby_id)m=true}if(a=='name_short'){const sr=[...g.items].sort((x,y)=>(x.name||'').length-(y.name||'').length);if(i.emby_id===sr[0].emby_id)m=true}}
    if(t=='filesize'){const g=st.d.find(gx=>gx.items.some(ix=>ix.emby_id===i.emby_id));const sr=[...g.items].sort((x,y)=>x.size-y.size);if(a=='min'&&i.emby_id===sr[0].emby_id)m=true;if(a=='max'&&i.emby_id===sr[sr.length-1].emby_id)m=true}
    if(m)st.s.add(i.emby_id);else if(t=='all'&&!a)st.s.delete(i.emby_id);});
    // 不清空重新渲染，只刷新状态
    st.loaded = 0; $('rbox').innerHTML = ''; renderMore(s.length);
}

function getFlatSlice(){let f=[];st.d.forEach(g=>{const ids=g.items.map(x=>x.emby_id).join(',');g.items.forEach(i=>{f.push({...i,groupTitle:g.title,groupItemsIds:ids,groupRaw:g})})});return f}

function renderMore(count = PAGE_SIZE) {
    if (st.loading) return;
    const f = getFlatSlice();
    if (st.loaded >= f.length) {
        $('load-status').innerText = f.length === 0 ? "✨ 无匹配项目" : "✅ 已加载全部";
        return;
    }
    
    st.loading = true;
    $('load-status').innerText = "⏳ 加载中...";
    
    const slice = f.slice(st.loaded, st.loaded + count);
    let h = ''; let lg = "";
    
    slice.forEach((i, idx) => {
        const k=st.s.has(i.emby_id);let img=i.has_poster?`<img src="${appConfig.host}/emby/Items/${i.emby_id}/Images/Primary?maxHeight=150" class="w-16 h-24 object-cover mx-4 rounded-lg flex-shrink-0 shadow-md">`:'';
        
        // 🚀 路径显示逻辑优化：同大查重(size) 显示路径对比
        let subT="";
        if(st.m=='size' || st.m=='duration'){
            let dp=i.path.substring(0,i.path.lastIndexOf('/')+1);
            let ps=i.groupRaw.items.map(x=>x.path.substring(0,x.path.lastIndexOf('/')+1));
            let cm="";
            if(ps.length){
                let p1=ps[0].split('/');
                let res=[];
                for(let j=0;j<p1.length;j++){if(ps.every(px=>px.split('/')[j]===p1[j]))res.push(p1[j]);else break}
                cm=res.join('/')+'/'
            }
            // 路径对比样式：基础路径 + 差异路径
            subT=cm?`<span class="path-base">${cm}</span><span class="path-diff">${dp.replace(cm,"")}</span>`:`<span class="path-diff">${dp}</span>`
        }else{
            subT=`<span class="path-base">${i.display_path}</span>`
        }
        
        if(i.groupItemsIds!==lg){
            const allC=i.groupRaw.items.every(x=>st.s.has(x.emby_id));
            // 🚀 组选择逻辑：点击整个标题栏 (onclick) 触发
            h+=`<div class="bg-slate-800/40 rounded-2xl overflow-hidden mb-4 border border-white/5 shadow-xl mt-4"><div class="px-5 py-4 border-b border-white/5 bg-white/5 font-bold text-sky-400 flex items-center gap-4 cursor-pointer hover:bg-white/10 transition" onclick="togG('${i.groupItemsIds}',!${allC})"><input type="checkbox" class="w-5 h-5 accent-sky-500 cursor-pointer flex-shrink-0 pointer-events-none" ${allC?'checked':''}><span class="text-lg truncate select-none">${i.groupTitle}</span></div>`;
            lg=i.groupItemsIds;
        }

        const jI=`<svg onclick="jumpToEmby('${i.emby_id}', event)" class="w-5 h-5 text-sky-400 hover:text-white cursor-pointer ml-auto flex-shrink-0 transition hover:scale-125" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>`;
        let tags = "";
        if(i.tag_c) tags += `<span class="ml-2 px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-400 text-[10px] font-bold border border-sky-500/30">C</span>`;
        if(i.tag_uc) tags += `<span class="ml-2 px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-400 text-[10px] font-bold border border-rose-500/30">UC</span>`;
        if(i.tag_u) tags += `<span class="ml-2 px-1.5 py-0.5 rounded bg-purple-500/20 text-purple-400 text-[10px] font-bold border border-purple-500/30">U</span>`;
        if(st.m === 'duration') {
            const sizes = i.groupRaw.items.map(x=>x.size);
            const minS = Math.min(...sizes); const maxS = Math.max(...sizes);
            if(sizes.length > 1) {
                if(i.size === minS) tags += `<span class="ml-2 px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-400 text-[10px] font-bold border border-emerald-500/30">最小文件</span>`;
                if(i.size === maxS) tags += `<span class="ml-2 px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-400 text-[10px] font-bold border border-rose-500/30">最大文件</span>`;
            }
        }
        
        // 🚀 路径字体从 10px 提升到 12px (text-[10px] -> text-xs)
        h+=`<div class="res-item ${k?'checked':''}" onclick="tog(${st.loaded + idx})"><div class="w-8 text-center text-xl flex-shrink-0">${k?'✅':'⬜'}</div>${img}<div class="flex-1 px-4 min-w-0"><div class="font-bold truncate text-white text-base flex items-center gap-2">${i.name} ${tags}</div><div class="mt-1 break-all text-xs text-slate-400 font-mono leading-tight">${subT}</div><div class='text-[10px] mt-1 text-slate-500 font-mono'><span class="text-sky-300 font-bold mr-1">${(i.size/1e6).toFixed(1)}MB</span> | ${i.duration||0}S</div></div>${jI}</div>`
        
        if (idx === slice.length - 1 || slice[idx+1].groupItemsIds !== i.groupItemsIds) {
             h+=`</div>`; 
        }
    });

    $('rbox').insertAdjacentHTML('beforeend', h);
    st.loaded += slice.length;
    $('rc-total').innerText = f.length;
    $('rc-shown').innerText = st.loaded;
    $('dn').innerText = st.s.size;
    if (st.s.size > 0) $('act-bar').classList.remove('hidden'); else $('act-bar').classList.add('hidden');
    st.loading = false;
    $('load-status').innerText = st.loaded >= f.length ? "✅ 已加载全部" : "🖱️ 下滑加载更多...";
}

function tog(idx){
    const f=getFlatSlice();
    const i=f[idx];
    if(st.s.has(i.emby_id))st.s.delete(i.emby_id);else st.s.add(i.emby_id);
    const items = document.querySelectorAll('.res-item');
    if(items[idx]) {
        if(st.s.has(i.emby_id)) items[idx].classList.add('checked'); else items[idx].classList.remove('checked');
        items[idx].querySelector('div:first-child').innerHTML = st.s.has(i.emby_id) ? '✅' : '⬜';
    }
    $('dn').innerText = st.s.size;
    if(st.s.size > 0)$('act-bar').classList.remove('hidden');else $('act-bar').classList.add('hidden');
}

function togG(ids,c){ids.split(',').forEach(id=>{if(c)st.s.add(id);else st.s.delete(id)}); 
    // 重置并刷新当前已加载数量，确保视觉一致
    st.loaded = 0; $('rbox').innerHTML = ''; renderMore(Math.max(PAGE_SIZE, document.querySelectorAll('.res-item').length));
}

function jumpToEmby(eid, e) { e.stopPropagation(); if(!appConfig.host){toast("❌ 配置未加载");return} const target=st.sid?`${appConfig.host}/web/index.html#!/item?id=${eid}&serverId=${st.sid}`:`${appConfig.host}/web/index.html#!/item?id=${eid}`; window.open(target, '_blank'); }
async function del() { confirmUI("物理删除","操作不可逆。","🗑️",async()=>{const ids=Array.from(st.s);if(!ids.length)return;st.d=st.d.map(g=>{g.items=g.items.filter(i=>!st.s.has(i.emby_id));return g}).filter(g=>['av','smart','size','duration'].includes(st.m)?g.items.length>1:g.items.length>0);st.s.clear();
$('rbox').innerHTML=''; st.loaded=0; renderMore(); 
$('act-bar').classList.add('hidden');toast("⚡ 正在执行删除...");await fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})})}) }
async function ignoreItems(){
    const ids=Array.from(st.s); if(!ids.length){toast("❌ 未勾选");return}
    st.d=st.d.map(g=>{g.items=g.items.filter(i=>!st.s.has(i.emby_id));return g}).filter(g=>['av','smart','size','duration'].includes(st.m)?g.items.length>1:g.items.length>0);
    st.s.clear(); $('rbox').innerHTML=''; st.loaded=0; renderMore();
    $('act-bar').classList.add('hidden'); toast("✅ 已添加忽略");
    await fetch('/api/ignore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids: ids, mode: st.m})});
}
async function refreshItems(){const ids=Array.from(st.s);if(!ids.length){toast("❌ 未选中");return}toast("⏳ 指令下发中...");st.d=st.d.map(g=>{g.items=g.items.filter(i=>!st.s.has(i.emby_id));return g}).filter(g=>['av','smart','size'].includes(st.m)?g.items.length>1:g.items.length>0);st.s.clear(); $('rbox').innerHTML=''; st.loaded=0; renderMore();
$('act-bar').classList.add('hidden');const r=await fetch('/api/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})});const res=await r.json();if(res.status==='ok')toast(`✅ 指令已送达，后台正在热更新...`);else toast("❌ 请求失败")}
async function loadIgnored(){
    st.ignS.clear(); const r=await fetch('/api/ignore');const d=await r.json();
    const modeMap = { "av": "番号", "smart": "洗版", "size": "同大", "duration": "时长", "noposter": "封面", "tiny": "极小", "global": "全局" };
    $('ignore-list').innerHTML=d.map(i=>`<div class="bg-white/5 p-3 rounded-xl border border-white/5 flex justify-between items-center"><div class="flex items-center gap-3 overflow-hidden min-w-0 flex-1"><input type="checkbox" class="ign-check w-4 h-4 accent-sky-500 cursor-pointer flex-shrink-0" value="${i.id}"><div class="flex flex-col min-w-0"><div class="truncate pr-2 text-xs text-slate-300 font-bold" title="${i.name||i.emby_id}">${i.name||i.emby_id}</div><div class="flex items-center gap-2 mt-1"><span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-700 text-slate-300 font-mono">${modeMap[i.mode] || i.mode}</span><span class="text-[10px] text-slate-600 font-mono truncate">${i.emby_id}</span></div></div></div><button class="btn btn-g py-1 px-3 text-[10px] flex-shrink-0 ml-2" onclick="ignRestoreSingle(${i.id})">恢复</button></div>`).join('')
}
async function ignRestoreSingle(id){await fetch(`/api/ignore/${id}`,{method:'DELETE'});loadIgnored()}
async function ignRestoreBulk(){
    const ids=Array.from(st.ignS);if(!ids.length){toast("❌ 未勾选");return}
    await Promise.all(ids.map(id => fetch(`/api/ignore/${id}`,{method:'DELETE'})));
    toast("✅ 批量恢复完成"); st.ignS.clear(); loadIgnored();
}
function ignBatch(c){ const checks = document.querySelectorAll('.ign-check'); checks.forEach(x => { x.checked = c; if(c) st.ignS.add(x.value); else st.ignS.delete(x.value); }); if(!c) st.ignS.clear(); }
document.addEventListener('change', function(e){ if(e.target.classList.contains('ign-check')){ if(e.target.checked) st.ignS.add(e.target.value); else st.ignS.delete(e.target.value); } });
async function loadTasks(){
    const r=await fetch('/api/tasks'); currentTasks=await r.json();
    const c=await(await fetch('/api/config')).json();
    let h = '';
    if(c.cron_sync) {
        h = `<div class='p-3 bg-sky-500/10 rounded-xl border border-sky-500/20 mb-2 flex justify-between items-center'>
            <div class="text-xs text-white">全量同步 (系统同步) <span class="text-[10px] text-slate-500 block font-mono">SYSTEM | ${c.cron_sync}</span></div>
            <div class="flex gap-2">
                <button class="btn btn-p py-1 px-3 text-[10px]" onclick="editSystemSync('${c.cron_sync}')">编辑</button>
                <button class="btn btn-d py-1 px-3 text-[10px]" onclick="delSystemSync()">删除</button>
            </div>
        </div>`;
    }
    let list=currentTasks.map(x=>`<div class='p-3 bg-white/5 rounded-xl border border-white/5 flex justify-between items-center mb-2'><div class="text-xs text-white">${x.name} <span class="text-[10px] text-slate-500 block font-mono">${x.mode.toUpperCase()} | ${x.cron}</span></div><div class="flex gap-2"><button class="btn btn-p py-1 px-3 text-[10px]" onclick="editTask(${x.id})">编辑</button><button class="btn btn-d py-1 px-3 text-[10px]" onclick="delTask(${x.id})">删除</button></div></div>`).join('');
    $('task-list').innerHTML=h+list||'<div class="text-slate-500 text-center py-4 text-[10px]">无任务</div>'}
function editSystemSync(cron){ $('sync-cron-dash').focus(); $('sync-cron-dash').scrollIntoView({behavior:'smooth'}); toast("请在下方配置区修改全量更新定时"); }
async function delSystemSync(){ 
    confirmUI("取消系统同步","确定要关闭全量同步定时吗？","🔄", async()=>{
        const c=await(await fetch('/api/config')).json();
        const p={host:c.host,user:c.user,webhook:c.webhook,cron_sync:""};
        await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
        toast("✅ 系统同步已关闭"); lc(); loadTasks();
    });
}
async function delTask(id){await fetch(`/api/tasks/${id}`,{method:'DELETE'});loadTasks()}
function editTask(id){const t=currentTasks.find(x=>x.id===id);if(t){$('m-id').value=t.id;$('m-name').value=t.name;$('m-cron').value=t.cron;$('m-mode').value=t.mode;$('m-libs').value=t.libraries;$('modal').classList.add('open')}}
function openAddModal(){$('m-id').value='';$('m-name').value='定时任务';$('m-cron').value='0 8 * * *';$('m-mode').value=st.m;$('m-libs').value=Array.from(st.ls).join(',');$('modal').classList.add('open')}
function closeModal(){$('modal').classList.remove('open')}
async function submitTask(){const id=$('m-id').value;const b={name:$('m-name').value,cron:$('m-cron').value,mode:$('m-mode').value,libraries:$('m-libs').value,enabled:true};const method=id?'PUT':'POST';const url=id?`/api/tasks/${id}`:'/api/tasks';await fetch(url,{method:method,headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});closeModal();loadTasks()}
async function save(){
  try{
    const payload={host:$('ch').value,user:$('cu').value,pwd:$('cp').value,webhook:$('cw').value,cron_sync:$('sync-cron-dash').value};
    const resp=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data=await resp.json().catch(()=>({}));
    if(data.ok===false) throw new Error(data.message||'保存失败');
    await lc();
    toast('✅ 保存成功');
    return true;
  }catch(e){
    console.error(e);
    toast(`❌ 保存失败: ${e.message||e}`);
    return false;
  }
}
async function saveSyncDash(){const ok=await save(); if(ok) await loadTasks()}
async function lc(){const c=await(await fetch('/api/config')).json();if(c.host&&!c.host.startsWith('http'))c.host='http://'+c.host;if(c.host&&c.host.endsWith('/'))c.host=c.host.slice(0,-1);appConfig=c;$('ch').value=c.host;$('cu').value=c.user;$('cw').value=c.webhook;$('sync-cron-dash').value=c.cron_sync}
async function testWebhook(){try{const resp=await fetch('/api/test_webhook',{method:'POST'}); if(!resp.ok) throw new Error(`HTTP ${resp.status}`); toast('🔔 Webhook 测试已发送')}catch(e){toast(`❌ Webhook 测试失败: ${e.message||e}`)}}
async function ll(){const r=await(await fetch('/api/logs')).json();$('lbox').innerHTML=r.map(l=>`<div class="log-line border-b border-white/5 py-1 break-all whitespace-pre-wrap">${l}</div>`).join('');$('lbox').scrollTop=$('lbox').scrollHeight}
async function clearLogs(){try{const resp=await fetch('/api/logs/clear',{method:'POST'}); if(!resp.ok) throw new Error(`HTTP ${resp.status}`); await ll()}catch(e){toast(`❌ 清空日志失败: ${e.message||e}`)}}
</script></body></html>
